<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 310px; padding: 15px; font-family: Arial, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 15px 0; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      padding: 12px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer;
    }
    .fast { background: #e63939; color: white; }
    .slow { background: #457b9d; color: white; }
    .reset { background: #666; color: white; grid-column: span 2; }
    .download { 
      background: #2a9d8f; 
      color: white; 
      font-weight: bold; 
      margin: 6px 0; 
    }
    .stop { 
      background: #d62828; 
      color: white; 
      font-weight: bold; 
      grid-column: span 2; 
      margin: 8px 0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status { margin-top: 12px; text-align: center; font-size: 14px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>Video Turbo + Download/Gravacao</h1>
  
  <div class="grid">
    <button class="slow" id="speed025">0.25x</button>
    <button class="slow" id="speed05">0.5x</button>
    <button class="fast" id="speed2">2x</button>
    <button class="fast" id="speed4">4x</button>
    <button class="fast" id="speed8">8x</button>
    <button class="fast" id="speed16">16x</button>
  </div>

  <button class="download" id="downloadDirectVideo">Video (Link Direto)</button>
  <button class="download" id="downloadDirectAudio">Audio (MP3)</button>
  <button class="download" id="downloadRecord">Gravar e Baixar no Final</button>
  
  <button class="stop" id="stopRecording" style="display: none;">Parar Gravacao</button>

  <button class="reset" id="reset">Voltar ao normal (1x)</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
